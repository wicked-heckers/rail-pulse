<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" fill="none" className="w-full h-full">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.65" />
      <circle cx="0" cy="0" r="1.2" fill="#CBD5E1" opacity="0.8" />
    </pattern>

    <!-- Rail Track Patterns -->
    <linearGradient id="railGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F294A" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="railGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#0F294A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F294A" stop-opacity="0" />
    </linearGradient>

    <!-- Mask for Soft Fade towards Bottom and Edges -->
    <radialGradient id="centerFade" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </radialGradient>

    <mask id="fadeMask">
      <rect width="1440" height="960" fill="url(#centerFade)" />
    </mask>
  </defs>

  <g mask="url(#fadeMask)">
    <!-- Subtle Grid Base -->
    <rect width="1440" height="960" fill="url(#grid)" />

    <!-- Ambient Gradient Blobs -->
    <circle cx="200" cy="180" r="280" fill="#E0F2FE" opacity="0.45" filter="blur(60px)" />
    <circle cx="1240" cy="260" r="320" fill="#F0FDF4" opacity="0.4" filter="blur(70px)" />
    <circle cx="720" cy="380" r="260" fill="#EEF2FF" opacity="0.35" filter="blur(80px)" />

    <!-- Trunk Line 1 (Main Down Track) with Ties / Sleepers -->
    <path d="M -60 120 C 320 80, 520 280, 840 240 C 1140 200, 1320 340, 1500 320" 
          stroke="url(#railGrad1)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M -60 126 C 320 86, 520 286, 840 246 C 1140 206, 1320 346, 1500 326" 
          stroke="url(#railGrad1)" stroke-width="1.5" stroke-dasharray="4 8" fill="none" opacity="0.7" />

    <!-- Trunk Line 2 (Parallel Up Track) -->
    <path d="M -60 144 C 320 104, 520 304, 840 264 C 1140 224, 1320 364, 1500 344" 
          stroke="url(#railGrad2)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M -60 150 C 320 110, 520 310, 840 270 C 1140 230, 1320 370, 1500 350" 
          stroke="url(#railGrad2)" stroke-width="1.5" stroke-dasharray="4 8" fill="none" opacity="0.6" />

    <!-- Switch / Loop Turnout at Cuttack / Jakhapura Section -->
    <path d="M 420 180 C 560 210, 680 320, 940 310 C 1180 300, 1360 480, 1500 460" 
          stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.35" />
    <path d="M 440 185 L 470 210" stroke="#0284C7" stroke-width="1.5" opacity="0.4" />

    <!-- Secondary Freight Corridor (Bypass Loop) -->
    <path d="M -60 380 C 240 360, 480 500, 800 460 C 1120 420, 1340 600, 1500 580" 
          stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" fill="none" opacity="0.3" />

    <!-- Station Junction Nodes & Signal Indicators -->
    <!-- Bhadrak Station Anchor -->
    <g transform="translate(180, 102)">
      <circle cx="0" cy="0" r="14" fill="#0F294A" fill-opacity="0.06" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" stroke="#0F294A" stroke-width="2" />
      <circle cx="0" cy="0" r="2.5" fill="#0284C7" />
      <text x="14" y="4" font-family="'Mulish', monospace" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">BHC</text>
    </g>

    <!-- Jajpur Keonjhar Rd Node -->
    <g transform="translate(480, 240)">
      <circle cx="0" cy="0" r="12" fill="#0284C7" fill-opacity="0.08" />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
      <circle cx="0" cy="0" r="2" fill="#0284C7" />
      <text x="12" y="4" font-family="'Mulish', monospace" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.5">JJKR</text>
    </g>

    <!-- Cuttack Junction Major Node (Dual Ring) -->
    <g transform="translate(840, 240)">
      <circle cx="0" cy="0" r="18" fill="#10B981" fill-opacity="0.08" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3 3" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" stroke="#0F294A" stroke-width="2.5" />
      <circle cx="0" cy="0" r="3" fill="#10B981" />
      <text x="-16" y="-14" font-family="'Mulish', monospace" font-size="11" font-weight="800" fill="#0F294A" letter-spacing="0.5">CTC JN</text>
    </g>

    <!-- Bhubaneswar Node -->
    <g transform="translate(1080, 225)">
      <circle cx="0" cy="0" r="16" fill="#0F294A" fill-opacity="0.08" />
      <circle cx="0" cy="0" r="7" fill="#FFFFFF" stroke="#0F294A" stroke-width="2.5" />
      <circle cx="0" cy="0" r="3.5" fill="#0284C7" />
      <text x="14" y="4" font-family="'Mulish', monospace" font-size="12" font-weight="800" fill="#0F294A" letter-spacing="0.5">BBS</text>
    </g>

    <!-- Puri Terminal Anchor -->
    <g transform="translate(1360, 335)">
      <circle cx="0" cy="0" r="14" fill="#0F294A" fill-opacity="0.06" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" stroke="#0F294A" stroke-width="2" />
      <circle cx="0" cy="0" r="2.5" fill="#0F294A" />
      <text x="-42" y="4" font-family="'Mulish', monospace" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">PURI</text>
    </g>

    <!-- Subtle Signal Aspect Lights -->
    <circle cx="340" cy="115" r="3" fill="#10B981" opacity="0.75" />
    <circle cx="680" cy="272" r="3" fill="#F59E0B" opacity="0.8" />
    <circle cx="980" cy="232" r="3" fill="#10B981" opacity="0.75" />
    <circle cx="1220" cy="285" r="3" fill="#10B981" opacity="0.75" />
  </g>
</svg>
