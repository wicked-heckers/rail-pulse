services:
  api:
    build: .
    container_name: railpulse-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://railpulse:railpulse_secret@postgis:5432/railpulse_db
      - REDIS_URL=redis://redis:6379/0
      - WORKERS=1
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgis:
    image: postgis/postgis:16-3.4
    container_name: railpulse-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: railpulse
      POSTGRES_PASSWORD: railpulse_secret
      POSTGRES_DB: railpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railpulse -d railpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: railpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
  redis_data:
